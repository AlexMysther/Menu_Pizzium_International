<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pizzium - Gestione menu</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-card">

  <header class="admin-header">
    <img class="admin-logo" src="img/logo.png" alt="Pizzium">
    <h1>Gestione menu</h1>
  </header>

  <div id="configWarning" class="admin-warning" hidden>
    Firebase non è ancora configurato: modifica <code>js/firebase-config.js</code>
    con i dati del tuo progetto (vedi README) prima di usare questa pagina.
  </div>

  <form id="loginForm" class="admin-login" hidden>
    <label>Email
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <button type="submit">Accedi</button>
    <p id="loginError" class="admin-error" hidden></p>
  </form>

  <div id="panel" class="admin-panel" hidden>
    <div class="admin-panel-header">
      <span id="loggedInAs"></span>
      <button type="button" id="logoutBtn">Esci</button>
    </div>
    <div class="admin-tabs" role="tablist">
      <button type="button" class="admin-tab active" id="tabAvailability" role="tab" aria-selected="true" aria-controls="itemGroups">Disponibilità</button>
      <button type="button" class="admin-tab" id="tabRecommended" role="tab" aria-selected="false" aria-controls="itemGroups">Consigliati</button>
    </div>
    <p class="admin-hint" id="adminHint"></p>
    <div id="itemGroups"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
